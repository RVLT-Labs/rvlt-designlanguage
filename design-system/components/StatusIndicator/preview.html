<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusIndicator — preview</title></head>
<body>
<div id="root" style="padding:16px"></div>
<script>
var h = React.createElement, R = window.Rvlt, F = React.Fragment;
var row = function () { return h.apply(null, ['div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '12px', marginBottom: '12px' } }].concat([].slice.call(arguments))); };
function Demo() {
  var dots = [['ok','Available'],['live','Connection live'],['warn','Prepping'],['overbooked','Overdue'],['repair','In repair'],['neutral','Enquiry']];
  return row.apply(null, dots.map(function (d) { return h(R.StatusIndicator, { key: d[1], intent: d[0], label: d[1] }); }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
