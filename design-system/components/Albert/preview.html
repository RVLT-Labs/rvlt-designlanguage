<!-- @dsCard group="Illustration" height=380 subtitle="Pack artwork — RVLT's character" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Albert — preview</title>
<style>
  .art { display: block; height: auto; max-width: 100%; pointer-events: none; }
  .stage { display: flex; gap: var(--space-6); align-items: flex-start; padding: var(--space-5); flex-wrap: wrap; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); margin-bottom: var(--space-2); }
  .states { display: grid; grid-template-columns: repeat(3, 88px); gap: var(--space-3); }
  .state { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); font-size: 12px; color: var(--ink-2); text-align: center; }
  .chat { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-4); font-size: 13.5px; color: var(--ink-2); }
</style></head>
<body>
<div class="stage">
  <div>
    <div class="label">Assistant states — face plus live text</div>
    <div class="states">
      <div class="state"><img class="art" src="/_blob/5451de893bc26215a16d3802dacb1133" alt="" width="64" height="64" style="width:64px">Ready</div>
      <div class="state"><img class="art" src="/_blob/9ea67bd3b488f01af3a23f126d4e9b62" alt="" width="64" height="64" style="width:64px">Listening</div>
      <div class="state"><img class="art" src="/_blob/5e09147c1c61ef2e855fb126969f56be" alt="" width="64" height="64" style="width:64px">Thinking…</div>
      <div class="state"><img class="art" src="/_blob/b267bc3fce9727bcd612bc4e3a8cb5a9" alt="" width="64" height="64" style="width:64px">Which job?</div>
      <div class="state"><img class="art" src="/_blob/6df85931355718904577ce9fea5f9548" alt="" width="64" height="64" style="width:64px">Done</div>
      <div class="state"><img class="art" src="/_blob/aa0b390fa79cde30773e1f1480a0940b" alt="" width="64" height="64" style="width:64px">Let's retry</div>
    </div>
    <div class="chat"><img class="art" src="/_blob/f99d6179334c823ae4ce565c7bfa4d0e" alt="" width="32" height="32" style="width:32px"><img class="art" src="/_blob/ac29a48dd632f170ee48bc7e448798b5" alt="" width="32" height="32" style="width:32px;background:var(--dark);border-radius:8px">Icon on light / cream on dark</div>
  </div>
  <div class="rf-panel" style="max-width:300px">
    <div class="label">Welcome — a locked illustration</div>
    <img class="art" src="/_blob/0bcf130c2db775899f073e0722e1c6fc" alt="Albert sitting, waving hello" width="1374" height="1145" style="width:240px">
    <div style="margin-top:var(--space-2);font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink)">Welcome to the crew.</div>
  </div>
</div>
</body>
</html>
