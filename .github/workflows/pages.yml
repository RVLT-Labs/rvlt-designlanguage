name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/preview-v2/package-lock.json

      - name: Check the design-system mirror against flow-theme
        run: node scripts/design-system/check.mjs

      - name: Build flow-theme (CSS + resolved registry)
        working-directory: packages/flow-theme
        run: |
          node scripts/build-css.mjs
          node scripts/build-registry.mjs

      - name: Install preview-v2 deps
        working-directory: apps/preview-v2
        run: npm ci

      - name: Compile local Flow gallery and check contracts
        run: |
          node scripts/design-system/bundle/build-registry.mjs
          npm test
          npm run check
          npm --prefix apps/preview-v2 run typecheck

      - name: Build preview-v2 (Next.js static export)
        working-directory: apps/preview-v2
        run: npm run build

      - name: Assemble site
        # root brand reference, examples, assets, /design-system/, /preview-v2/, /r/ and the
        # compatibility redirects for the moved pages (light.html, preview.html)
        run: node scripts/site/build.mjs _site --preview-v2 apps/preview-v2/out --registry packages/flow-theme/dist

      - name: Check every internal link and asset
        run: node scripts/site/check-links.mjs _site

      - name: Install browser regression dependencies
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify built Pages site in Chromium
        env:
          RVLT_SITE_DIR: ${{ github.workspace }}/_site
          RVLT_EVIDENCE_DIR: ${{ github.workspace }}/browser-evidence
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
